<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig for the container: the only font the server renders with is wellcome-bold.ttf in this
     directory, which libvips loads by path. This file exists so fontconfig has a config to load at all;
     Dockerfile-iiifbuilder points FONTCONFIG_FILE at it. Resources/ is copied to the output but, unlike
     wwwroot/, is not served, so the font is not downloadable. -->
<fontconfig>
  <dir>/app/Resources/born-digital</dir>
  <cachedir>/tmp</cachedir>
  <!-- the system config and fonts (fontconfig-config and fonts-dejavu-core come with poppler-utils in the
       Dockerfile), so the subprocess rasteriser and libvips see the same fonts -->
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
