# Runs the smoke tests (src/Wellcome.Dds/Wellcome.Dds.SmokeTests) against a deployed environment, from outside
# and with no credentials. Deploy calls this once the services are stable; it can also be run by hand.
# Report only: failures appear in the run summary and as annotations, but don't fail the run.
name: Smoke test
run-name: Smoke test ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to test
        type: choice
        options: [staging, staging-prod, production]
        required: true
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # If the environment isn't up (staging-prod shuts down at 18:00), skip with a note rather than
      # report every check as failed.
      - name: Check the environment is reachable from GitHub
        id: reach
        env:
          SMOKE_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          fixtures="src/Wellcome.Dds/Wellcome.Dds.SmokeTests/Fixtures/${SMOKE_ENV}.json"
          if ! [[ "$SMOKE_ENV" =~ ^[a-z-]+$ ]] || [ ! -f "$fixtures" ]; then
            echo "::error::No smoke test fixtures for environment '$SMOKE_ENV'"
            exit 1
          fi
          host=$(jq -r .host "$fixtures")
          code=$(curl -s -o /dev/null -m 20 -A "wellcome-dds-smoke-test/1.0" -w '%{http_code}' "$host/management/healthcheck" || true)
          if [ -z "$code" ] || [ "$code" = "000" ]; then code=""; fi
          if [ "$code" = "200" ]; then
            echo "reachable=true" >> "$GITHUB_OUTPUT"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$host isn't answering (health check: ${code:-no answer}); skipped the smoke tests"
            {
              echo "### Smoke test skipped: $SMOKE_ENV"
              echo
              echo "$host isn't answering (health check: ${code:-no answer}), so the smoke tests didn't run. Staging-prod shuts down at 18:00. Once it's up, run this workflow again by hand, or locally:"
              echo
              echo '```bash'
              echo "cd src/Wellcome.Dds"
              echo "SMOKE_ENV=$SMOKE_ENV dotnet test Wellcome.Dds.SmokeTests/Wellcome.Dds.SmokeTests.csproj"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.reach.outputs.reachable == 'true'
        with:
          dotnet-version: "10.0.x"

      - name: Smoke test
        if: steps.reach.outputs.reachable == 'true'
        continue-on-error: true
        working-directory: src/Wellcome.Dds
        env:
          SMOKE_ENV: ${{ inputs.environment }}
        run: >
          dotnet test Wellcome.Dds.SmokeTests/Wellcome.Dds.SmokeTests.csproj
          --logger GitHubActions --logger "console;verbosity=normal"
